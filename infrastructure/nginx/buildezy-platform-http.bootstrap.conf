# Temporary HTTP-only configuration used to obtain the first public certificate.
# Replace this file with buildez-platform.conf.example after Certbot succeeds.
upstream buildez_app {
    server 127.0.0.1:3100;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name getbuildezy.com www.getbuildezy.com *.getbuildezy.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/buildezy/acme;
        default_type text/plain;
    }

    location / {
        proxy_pass http://buildez_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
